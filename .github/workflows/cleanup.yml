name: cleanup
on:
  schedule:
    # Weekly, Monday 03:19 UTC
    - cron: '19 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# Concurrent cleanups race each other into 404s on already-deleted
# versions, which the action treats as a hard failure.
concurrency:
  group: ghcr-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Delete all containers from repository without tags
        uses: Chizkiyahu/delete-untagged-ghcr-action@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          owner_type: user
          repository_owner: scagood
          repository: profanity
          package_name: profanity
          untagged_only: true
